[project]
name = "pinarkive-sdk-py"
version = "3.1.4"
description = "Python SDK for PinArkive API v3 – minimal client (upload, pin, remove, users/me, uploads, tokens, status, allocations). See https://docs.pinarkive.com"
authors = [
  {name = "PinArkive"},
  {name = "Joel_da"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.34.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/pinarkive/pinarkive-sdk-py"
Repository = "https://github.com/pinarkive/pinarkive-sdk-py.git"

[build-system]
requires = ["setuptools>=84.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pinarkive_client"]
license-files = []

[tool.pytest.ini_options]
testpaths = ["tests"]
